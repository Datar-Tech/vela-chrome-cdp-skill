<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      margin: 0;
      padding: 12px 16px;
      width: 280px;
      color: #1a1a1a;
      background: #fff;
    }
    h2 { margin: 0 0 12px; font-size: 15px; font-weight: 600; color: #111; }
    .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .dot.green { background: #22c55e; }
    .dot.red   { background: #ef4444; }
    .label { color: #555; min-width: 80px; }
    .value { font-weight: 500; }
    .targets { margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee; }
    .target-id {
      font-family: monospace; font-size: 11px; color: #555;
      background: #f5f5f5; padding: 2px 6px; border-radius: 3px;
      margin: 2px 0; display: block; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .hint {
      font-size: 11px; color: #888; margin-top: 10px;
      padding-top: 8px; border-top: 1px solid #eee;
    }
    .hint code { background: #f0f0f0; padding: 1px 4px; border-radius: 2px; }
  </style>
</head>
<body>
  <h2>Vela CDP Bridge</h2>
  <div class="row">
    <div class="dot" id="dot"></div>
    <span class="label">Bridge</span>
    <span class="value" id="status">checking...</span>
  </div>
  <div class="row">
    <span style="width:8px"></span>
    <span class="label">Attached</span>
    <span class="value" id="attached">—</span>
  </div>
  <div class="targets" id="targets-section" style="display:none">
    <div style="color:#555;margin-bottom:4px">Attached targets:</div>
    <div id="targets-list"></div>
  </div>
  <div class="hint">
    Run <code>node scripts/cdp-ext.mjs serve</code> to start the bridge,
    then use <code>cdp-ext.mjs</code> commands normally.
  </div>
  <script src="popup.js"></script>
</body>
</html>
